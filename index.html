<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Near Expiry Monitoring System (NEMS)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-gray-800 font-sans">

    <nav class="bg-blue-900 text-white p-4 shadow-md flex justify-between items-center">
        <div class="font-bold text-lg">CARD INDO GROSIR - NEMS</div>
        <div id="nav-user" class="text-xs font-semibold text-blue-200">Not Logged In</div>
    </nav>

    <div class="max-w-4xl mx-auto mt-10 p-4">
        <div id="panel-login" class="bg-white p-6 rounded shadow max-w-md mx-auto">
            <h2 class="text-xl font-bold mb-4 text-blue-900 text-center">System Login</h2>
            <form onsubmit="handleLogin(event)">
                <label class="block text-xs font-bold mb-1">Company Email</label>
                <input type="email" id="login-email" required placeholder="user@cardindogrosir.com" class="w-full border p-2 rounded mb-4 text-sm">
                <button type="submit" class="w-full bg-blue-800 text-white font-bold py-2 rounded text-sm hover:bg-blue-900">LOGIN</button>
            </form>
            <p id="login-error" class="text-red-600 text-xs mt-2 text-center"></p>
        </div>

        <div id="panel-dashboard" class="hidden space-y-6">
            <div id="admin-import-box" class="hidden bg-white p-4 rounded shadow border-l-4 border-amber-500">
                <h3 class="font-bold text-sm text-gray-700 mb-2">Admin Master Data Import</h3>
                <input type="file" id="excel-file" accept=".xlsx, .xls" class="text-xs mb-2">
                <button onclick="uploadExcel()" class="bg-amber-600 text-white font-bold px-3 py-1 text-xs rounded hover:bg-amber-700">Upload Master Excel Sheet</button>
                <div id="import-status" class="text-xs mt-1 font-semibold"></div>
            </div>

            <div class="bg-white p-6 rounded shadow space-y-4">
                <h2 class="text-lg font-bold text-blue-900 border-b pb-2">Near-Expiry Entry</h2>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold mb-1">Store Name</label>
                        <input type="text" id="store-name-view" readonly class="w-full bg-gray-100 border p-2 rounded text-xs font-bold">
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1">Select Supplier</label>
                        <select id="supplier-select" onchange="loadProducts()" class="w-full border p-2 rounded text-xs">
                            <option value="">-- Choose Supplier --</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold mb-1">Select Product</label>
                    <select id="product-select" class="w-full border p-2 rounded text-xs">
                        <option value="">-- Choose Product --</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-4 bg-blue-50 p-3 rounded">
                    <div>
                        <label class="block text-xs font-bold">Expiration Date 1 *</label>
                        <input type="date" id="exp1" required class="w-full border p-2 rounded text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-bold">Quantity 1 (0 - 500) *</label>
                        <input type="number" id="qty1" min="0" max="500" required class="w-full border p-2 rounded text-xs">
                    </div>
                </div>

                <button onclick="saveRecord()" class="w-full bg-green-700 text-white font-bold py-2 rounded text-sm hover:bg-green-800">SAVE MONITORING RECORD</button>
                <div id="save-status" class="text-xs text-center font-bold"></div>
            </div>
        </div>
    </div>

    <script>
        let authToken = '';
        let currentUser = null;

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const data = await res.json();
            if (res.ok) {
                authToken = data.token;
                currentUser = data.user;
                document.getElementById('nav-user').innerText = `${currentUser.email} (${currentUser.role})`;
                document.getElementById('store-name-view').value = currentUser.store_name;
                document.getElementById('panel-login').classList.add('hidden');
                document.getElementById('panel-dashboard').classList.remove('hidden');

                if (currentUser.role === 'ADMIN') {
                    document.getElementById('admin-import-box').classList.remove('hidden');
                }
                loadSuppliers();
            } else {
                document.getElementById('login-error').innerText = data.error;
            }
        }

        async function loadSuppliers() {
            const res = await fetch('/api/suppliers', {
                headers: { 'Authorization': `Bearer ${authToken}` }
            });
            const suppliers = await res.json();
            const sel = document.getElementById('supplier-select');
            sel.innerHTML = '<option value="">-- Choose Supplier --</option>';
            suppliers.forEach(s => {
                sel.innerHTML += `<option value="${s.supplier_name}">${s.supplier_name}</option>`;
            });
        }

        async function loadProducts() {
            const sup = document.getElementById('supplier-select').value;
            if (!sup) return;
            const res = await fetch(`/api/products?supplier=${encodeURIComponent(sup)}`, {
                headers: { 'Authorization': `Bearer ${authToken}` }
            });
            const products = await res.json();
            const sel = document.getElementById('product-select');
            sel.innerHTML = '<option value="">-- Choose Product --</option>';
            products.forEach(p => {
                sel.innerHTML += `<option value="${p.product_id}">${p.sku} - ${p.product_name}</option>`;
            });
        }

        async function saveRecord() {
            const productId = document.getElementById('product-select').value;
            const exp1 = document.getElementById('exp1').value;
            const qty1 = document.getElementById('qty1').value;

            if (!productId || !exp1 || qty1 === '') {
                alert('Please fill in Product, Expiration Date 1, and Quantity 1');
                return;
            }

            const res = await fetch('/api/store/monitoring', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${authToken}`
                },
                body: JSON.stringify({ product_id: productId, exp1, qty1 })
            });
            const data = await res.json();
            if (res.ok) {
                document.getElementById('save-status').innerText = "Record saved successfully!";
                document.getElementById('save-status').className = "text-xs text-center font-bold text-green-700";
            } else {
                document.getElementById('save-status').innerText = data.error;
                document.getElementById('save-status').className = "text-xs text-center font-bold text-red-700";
            }
        }

        async function uploadExcel() {
            const fileInput = document.getElementById('excel-file');
            if (!fileInput.files[0]) {
                alert('Please select an Excel file first');
                return;
            }
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            document.getElementById('import-status').innerText = "Importing master data... please wait...";
            const res = await fetch('/api/admin/import-excel', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${authToken}` },
                body: formData
            });
            const data = await res.json();
            if (res.ok) {
                document.getElementById('import-status').innerText = data.message;
                document.getElementById('import-status').className = "text-xs mt-1 font-semibold text-green-700";
                loadSuppliers();
            } else {
                document.getElementById('import-status').innerText = data.error;
                document.getElementById('import-status').className = "text-xs mt-1 font-semibold text-red-700";
            }
        }
    </script>
</body>
</html>
